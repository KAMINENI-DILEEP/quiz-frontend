<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Engine Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="glass-card border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-graduation-cap text-indigo-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wide text-indigo-200">ExamPro Portal</span>
        </div>
    </nav>
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- User Progress Tracker -->
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-bars-progress text-indigo-400 mr-2"></i>My Learning Progress</h3>
                <div class="w-full bg-slate-800 rounded-full h-3">
                    <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full" style="width: 75%"></div>
                </div>
            </div>
            <!-- Real-Time Leaderboard -->
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-trophy text-amber-400 mr-2"></i>Live Leaderboard</h3>
                <div id="leaderboard-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
            </div>
        </div>
    </main>
    <script>
        async function loadLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                document.getElementById('leaderboard-list').innerHTML = data.slice(0, 5).map((item, i) => `
                    <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-xl">
                        <span>#${i + 1} ${item.user ? item.user.name : 'Student'}</span>
                        <span class="text-indigo-400 font-bold">${item.score} pts</span>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }
        loadLeaderboard();
    </script>
</body>
</html>
